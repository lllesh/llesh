<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>  M A I L . L L E . S H</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>/* inbox.lle.sh (23/10/2026): a caixa de e-mail igual ao gmail, nas cores da paleta dela */
:root{
  --fundo:#FFFBF3; --branco:#fff; --lido:#FBF7EF; --cinza2:#ECE8E0; --linha:#EFEBE3; --neutro:#D6D4CE; --neutro2:#C8C4B9;
  --texto:#1f1f1f; --suave:#5f6368; --icone:#444746;
  --rosa:#F48591; --coral:#FA8D85; --pessego:#FEA283; --amarelo:#FFB872; --verde:#8DA599; --azul:#8D96C1; --malva:#C18EA9;
  --destaque-claro:#E3EAE5; --destaque-esc:#4F6A5D;
}
*{box-sizing:border-box;margin:0;padding:0}
a,button,input,select,textarea,[tabindex]{outline:none;-webkit-tap-highlight-color:transparent}
:focus,:focus-visible{outline:none;box-shadow:none}
html,body{height:100%}
body{background:var(--fundo);font-family:Montserrat,Arial,sans-serif;color:var(--texto);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.gs{font-family:Montserrat,Arial,sans-serif}

.redondo{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--icone);flex:none}
.redondo:hover{background:rgba(68,71,70,.08)}

/* barra de cima */
.barra{height:64px;display:flex;align-items:center;gap:4px;padding:0 8px}
.logo{font-family:Montserrat,Arial,sans-serif;font-size:22px;color:var(--suave);display:flex;align-items:center;gap:8px;width:248px;padding-left:4px}
.logo svg{width:32px;height:24px;stroke:none}
.busca{flex:0 1 720px;height:48px;background:#F1ECE2;border-radius:24px;display:flex;align-items:center;gap:14px;padding:0 24px;color:var(--icone);transition:background .15s, box-shadow .15s}
.busca:focus-within{background:#fff;box-shadow:0 1px 1px rgba(65,69,73,.3),0 1px 3px 1px rgba(65,69,73,.15)}
.busca input{flex:1;font-size:16px;color:var(--texto)}
.busca input::placeholder{color:#444746}
.eu{margin-left:auto;display:flex;align-items:center;gap:2px}
.foto{width:32px;height:32px;border-radius:50%;object-fit:cover;margin:0 8px 0 10px}

/* colunas */
.corpo{display:flex;height:calc(100vh - 64px);height:calc(100dvh - 64px)}
.lado{width:280px;flex:none;padding:0 0 16px;overflow:auto;transition:width .2s}
.escrever{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 28px 0 20px;margin:8px 0 16px 12px;border-radius:28px;background:var(--destaque-claro);color:#1f2a24;font-family:Montserrat,Arial,sans-serif;font-weight:500;font-size:16px;transition:box-shadow .15s}
.escrever:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
.escrever svg{width:24px;height:24px}
.pasta{width:calc(100% - 24px);margin-left:12px;height:38px;display:flex;align-items:center;gap:18px;padding:0 8px 0 18px;border-radius:19px;font-size:16px;color:#202124;text-align:left}
.pasta:hover{background:rgba(32,33,36,.06)}
.pasta.ativo{background:var(--destaque-claro);color:#1f2a24;font-weight:700}
.pasta .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pasta .n{margin-left:auto;padding-right:10px;font-size:14px;font-weight:700}
.pasta .pt{width:12px;height:12px;border-radius:50%;margin:0 4px}
.marcadores{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 6px 30px;font-family:Montserrat,Arial,sans-serif;font-size:16px;font-weight:500;color:#202124}
body.fechado .lado{width:72px}
body.fechado .lado .escrever{width:56px;padding:0 16px}
body.fechado .lado .escrever span,body.fechado .pasta .t,body.fechado .pasta .n,body.fechado .marcadores{display:none}
body.fechado .pasta{width:48px;padding:0 0 0 14px}

/* painel branco */
.painel{flex:1;min-width:0;background:var(--branco);border-radius:16px;margin:0 0 16px;display:flex;flex-direction:column;overflow:hidden}
.painel>section{display:flex;flex-direction:column;min-height:0;flex:1}
.ferr{height:48px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px}
.ferrSel{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:20px;background:var(--cinza2);margin:0 6px}
.pag{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--suave);font-size:14px}
.pag span{margin-right:8px}
.selcaixa{display:inline-flex;align-items:center;height:40px;border-radius:20px;padding:0 4px 0 11px;gap:2px;color:var(--icone)}
.selcaixa:hover{background:rgba(68,71,70,.08)}
.selcaixa svg{width:14px;height:14px}
.marca{width:14px;height:14px;border-radius:3px;border:1.5px solid #A5A199;display:grid;place-items:center;flex:none}
.marca.on{background:var(--destaque-esc);border-color:var(--destaque-esc)}
.marca.on:after{content:"";width:7px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}

.abas{display:flex;flex:none;border-bottom:1px solid var(--linha)}
.aba{flex:0 1 250px;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;color:var(--suave);font-size:16px;font-weight:500;position:relative;text-align:left}
.aba:hover{background:rgba(32,33,36,.04)}
.aba.ativo{color:var(--cor-t)}
.aba.ativo:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--cor)}
.aba .novos{font-size:13px;font-weight:500;color:#1f1f1f;background:var(--cor);border-radius:12px;padding:3px 12px}

.linhas{flex:1;overflow:auto}
.linha{display:flex;align-items:center;height:44px;padding:0 16px 0 10px;border-bottom:1px solid var(--linha);cursor:pointer;background:var(--lido);position:relative}
.linha.nova{background:#fff}
.linha:hover{box-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);z-index:1}
.linha.sel{background:var(--destaque-claro)}
.linha .marca{margin:0 13px}
.linha .est{width:32px;height:32px;display:grid;place-items:center;color:#b5b2aa;border-radius:50%}
.linha .est:hover{background:rgba(0,0,0,.06)}
.linha .est.on{color:var(--amarelo)}.linha .est.on svg{fill:currentColor}
.linha .est svg{width:18px;height:18px}
.linha .imp{width:22px;color:#c9c6be;display:grid;place-items:center}
.linha .imp.on{color:var(--pessego)}.linha .imp.on svg{fill:currentColor}
.linha .imp svg{width:16px;height:16px}
.linha .de{width:190px;flex:none;padding:0 22px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#202124}
.linha .de small{color:var(--suave);font-size:12px;margin-left:4px}
.linha .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--suave)}
.linha .txt b{color:#202124;font-weight:400}
.linha .txt .rot{display:inline-block;font-size:13px;padding:1px 12px;border-radius:999px;margin-right:6px;color:#202124}
.linha.nova .de,.linha.nova .txt b{font-weight:700;color:var(--texto)}
.linha .data{width:96px;flex:none;text-align:right;font-size:14px;color:var(--suave);padding-left:12px}
.linha.nova .data{font-weight:700;color:var(--texto)}
.linha .clip{display:inline-flex;vertical-align:-4px;margin-left:8px;color:var(--suave)}
.linha .clip svg{width:15px;height:15px}
.linha .rap{display:none;position:absolute;right:10px;top:0;height:43px;align-items:center;background:inherit;padding-left:10px}
.linha .rap button{width:36px;height:36px}
.linha .rap svg{width:18px;height:18px}
.linha:hover .rap{display:flex}
.linha:hover .data{visibility:hidden}
.vazio{color:var(--suave);text-align:center;padding:80px 0;font-size:15px}

/* e-mail aberto */
.leitura{flex:1;overflow:auto;padding:20px 24px 40px 72px}
.leitura h1{font-family:Montserrat,Arial,sans-serif;font-size:26px;font-weight:400;line-height:1.3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.etq{display:inline-flex;align-items:center;gap:6px;font-family:Montserrat,Arial,sans-serif;font-size:13px;padding:3px 12px;border-radius:999px;background:var(--cinza2);color:#444746}
.etq button{width:16px;height:16px;display:grid;place-items:center}
.etq svg{width:12px;height:12px}
.msgcab{display:flex;align-items:flex-start;gap:12px;position:relative}
.msgcab .av{position:absolute;left:-52px;top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#1f1f1f;font-weight:500;font-size:16px;flex:none}
.msgcab b{font-weight:700;font-size:16px}
.msgcab .mail{color:var(--suave);font-size:14px}
.msgcab .para{color:var(--suave);font-size:14px;margin-top:2px}
.msgcab .dir{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--suave);font-size:14px;white-space:nowrap}
.msgcab .dir span{margin-right:8px}
.estAberta.on{color:var(--amarelo)}.estAberta.on svg{fill:currentColor}
.texto{font-size:16px;line-height:1.6;color:#222;max-width:760px;margin-top:22px}
.texto p+p{margin-top:12px}
.anexos{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--linha)}
.anexo{width:180px;border:1px solid var(--cinza2);border-radius:8px;overflow:hidden;font-size:12px}
.anexo .cap{height:96px;background:var(--fundo);display:grid;place-items:center;color:var(--coral);font-weight:700;font-size:13px}
.anexo .nm{padding:8px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anexo .nm i{font-style:normal;background:var(--coral);color:#fff;border-radius:999px;padding:1px 9px;font-size:10px;font-weight:700}
.fio{margin-top:28px;border-top:1px solid var(--linha)}
.resp{position:relative;padding:18px 0 4px;border-bottom:1px solid var(--linha)}
.resp .texto{margin-top:12px}
.botoes{display:flex;gap:10px;margin-top:32px}
.pilula{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 22px 0 16px;border-radius:20px;border:1px solid #747775;color:#444746;font-family:Montserrat,Arial,sans-serif;font-weight:500}
.pilula:hover{background:rgba(68,71,70,.08)}
.caixaResp{margin-top:28px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.06);padding:14px 16px;max-width:820px}
.caixaResp .para{color:var(--suave);font-size:13px;margin-bottom:8px}
.caixaResp textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
.caixaResp .jpe{display:flex;align-items:center;gap:6px;margin-top:8px}

/* barra da direita */
.trilho{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.trilho .app{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.trilho .app:hover{background:rgba(68,71,70,.08)}
.trilho .app i{width:20px;height:20px;border-radius:50%;display:block}
.trilho hr{width:20px;border:0;border-top:1px solid var(--neutro)}

/* janela de escrever */
.janela{position:fixed;right:72px;bottom:0;width:560px;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12),0 5px 5px -3px rgba(0,0,0,.2);z-index:10;display:flex;flex-direction:column}
.jcab{height:42px;display:flex;align-items:center;padding:0 8px 0 16px;background:#F3EEE5;border-radius:12px 12px 0 0;font-family:Montserrat,Arial,sans-serif;font-weight:500;font-size:16px;cursor:pointer}
.jcab span{flex:1}
.jcab button{width:28px;height:28px;display:grid;place-items:center;border-radius:4px}
.jcab button:hover{background:rgba(0,0,0,.08)}
.jcab svg{width:16px;height:16px}
.jcorpo{display:flex;flex-direction:column;padding:0 16px}
.janela.min .jcorpo{display:none}
.janela.min{width:280px}
.jcorpo input{height:44px;border-bottom:1px solid var(--linha);font-size:16px}
.jcorpo textarea{height:300px;resize:none;padding:12px 0;line-height:1.5}
.jpe{display:flex;align-items:center;gap:6px;padding:10px 0 14px}
.jpe .redondo{margin-left:auto}
.enviar{height:36px;padding:0 24px;border-radius:18px;background:var(--destaque-esc);color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:500}
.enviar:hover{box-shadow:0 1px 3px rgba(60,64,67,.3)}

.aviso{position:fixed;left:24px;bottom:24px;background:#3c4043;color:#fff;border-radius:999px;padding:14px 26px;font-size:16px;transform:translateY(120px);transition:transform .25s;z-index:11}
.aviso.on{transform:none}
.flutua{display:none}
.linha .av{display:none}

/* celular */
@media (max-width:820px){
  body{overflow:auto}
  .barra{position:sticky;top:0;z-index:5;background:var(--fundo);padding:8px 12px;height:auto}
  .logo,.eu .redondo,.trilho{display:none}
  .busca{flex:1;height:46px;padding:0 22px}
  .corpo{height:auto!important;display:block}
  .lado{position:fixed;inset:0 auto 0 0;width:280px;background:var(--fundo);z-index:9;transform:translateX(-100%);transition:transform .25s;padding-top:16px;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.menu .lado{transform:none}
  body.fechado .lado{width:280px}
  .painel{margin:0;border-radius:0;overflow:visible}
  .ferr{position:sticky;top:62px;background:#fff;z-index:2}
  .abas{overflow-x:auto}.aba{flex:none;padding:0 14px}
  .linhas{overflow:visible}
  .linha{height:auto;padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center}
  .linha .marca,.linha .imp{display:none}
  .linha .av{display:grid;width:40px;height:40px;grid-row:1/3;grid-column:1;align-self:start}
  .linha .de{grid-column:2;grid-row:1;width:auto;padding:0}
  .linha .data{grid-column:3;grid-row:1;width:auto;padding:0}
  .linha .txt{grid-column:2;grid-row:2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .linha .est{grid-column:3;grid-row:2;justify-self:end;align-self:end;position:static;width:28px;height:28px}
  .linha:hover .rap{display:none}.linha:hover .data{visibility:visible}
  .leitura{padding:16px 16px 100px}
  .msgcab .av{position:static}
  .janela{left:0;right:0;width:auto;top:0;border-radius:0}
  .jcab{border-radius:0}
  .jcorpo textarea{height:calc(100vh - 220px)}
  .flutua{display:inline-flex;position:fixed;right:16px;bottom:16px;margin:0;z-index:6;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
  body.lendo .flutua{display:none}
}

/* mail.lle.sh (23/10/2026): a caixa de verdade */
.janela .de{display:flex;align-items:center;gap:10px;font-size:14px;color:#5f6368;padding:8px 0;border-bottom:1px solid var(--linha)}
.janela .de select{flex:1;border:0;background:transparent;font:inherit;color:#202124;outline:none}
body:not(.real) .janela .de{display:none}
body.real .trilho,body.real .marcadores,body.real .eu .redondo,body.real [data-acao="arquivo"],body.real [data-massa="arquivo"],body.real [data-acao="adiar"],body.real [data-massa="adiar"],body.real [data-rap="arquivo"],body.real [data-rap="adiar"],body.real .linha .imp{display:none!important}
body.real .linha .clip:empty{display:none}
.leitura iframe.carta{width:100%;border:0;min-height:60px;display:block}
.porta{display:none}
body.fechada .barra,body.fechada .corpo,body.fechada .flutua,body.fechada .janela,body.fechada .aviso{display:none!important}
body.fechada .porta{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#5f6368;font-family:Montserrat,Arial,sans-serif}
body.fechada .porta b{font-size:30px;font-weight:600}
a.anexo{color:inherit;text-decoration:none}

/* 23/10/2026: o design do Precedent (w.appp.to/precedent): creme, Libre Caslon nos títulos, Libre Franklin no texto,
   linhas douradas finas, rótulos em maiúsculas espaçadas, botão preto, campos e fichas da página de consulta */
:root{--fundo:#F0EADE;--branco:#EBE4D4;--lido:#EBE4D4;--cinza2:#DCD3BF;--linha:rgba(168,132,60,.28);--texto:#16130F;--suave:#5E574C;--icone:#3B352C;
  --ouro:#A8843C;--ouro2:#76591F;--vinho:#5A1E22;--tinta:#16130F;--campo:#F0EADE;--amarelo:#A8843C;--destaque-claro:#E2D8C2;--destaque-esc:#16130F;
  --serif:'Libre Caslon Display','Libre Caslon Text',Georgia,'Times New Roman',serif;--serif2:'Libre Caslon Text',Georgia,'Times New Roman',serif;--sans:'Libre Franklin','Helvetica Neue',Arial,sans-serif}
body,.gs,.logo,.escrever,.marcadores,.leitura h1,.etq,.pilula,.jcab,.enviar{font-family:var(--sans)}
body{background:var(--fundo);color:var(--texto);font-weight:400}
.redondo{border-radius:0;color:var(--icone)}
.redondo:hover{background:rgba(168,132,60,.12)}
.barra{height:84px;padding:0 24px;border-bottom:1px solid var(--linha)}
.corpo{height:calc(100vh - 84px);height:calc(100dvh - 84px)}
.logo{width:256px;gap:12px;color:var(--texto)}
.logo .selo{width:38px;height:38px;border-radius:50%;border:1px solid var(--ouro);box-shadow:inset 0 0 0 3px var(--fundo),inset 0 0 0 4px rgba(168,132,60,.6);display:grid;place-items:center;font-family:var(--serif);font-size:17px;color:var(--ouro2)}
.logo .nome{display:flex;flex-direction:column;font-family:var(--serif);font-size:22px;letter-spacing:.22em;line-height:1.1}
.logo .nome small{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:var(--vinho);text-transform:uppercase;margin-top:4px}
.busca{background:transparent;border:1px solid var(--linha);border-radius:0;height:44px}
.busca:focus-within{background:var(--campo);box-shadow:none;border-color:var(--ouro)}
.busca input{font-size:15px}
.busca input::placeholder{color:var(--suave);text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.foto{border:1px solid var(--ouro)}
.escrever{border-radius:0;background:var(--tinta);color:#F0EADE;height:52px;margin:20px 0 18px 24px;padding:0 30px 0 22px;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.escrever:hover{box-shadow:none;background:#2A251E}
.escrever svg{width:18px;height:18px}
.pasta{border-radius:0;height:38px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--icone);margin-left:24px;width:calc(100% - 36px);padding-left:12px;border-left:1px solid transparent}
.pasta:hover{background:rgba(168,132,60,.08)}
.pasta.ativo{background:transparent;color:var(--vinho);font-weight:600;border-left-color:var(--ouro)}
.pasta .n{font-size:12px;color:var(--vinho);font-variant-numeric:tabular-nums}
.pasta svg{width:17px;height:17px;stroke-width:1.4}
.painel{background:var(--branco);border-radius:0;margin:20px 24px 24px 0;border:1px solid var(--ouro);box-shadow:inset 0 0 0 7px var(--branco),inset 0 0 0 8px rgba(168,132,60,.45),0 24px 48px -28px rgba(22,19,15,.25)}
.ferr{height:56px;padding:0 18px;border-bottom:1px solid var(--linha)}
.pag{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.marca{border-radius:0;border-color:var(--ouro)}
.marca.on{background:var(--tinta);border-color:var(--tinta)}
.linhas{padding:0 10px}
.linha{height:52px;background:transparent;border-bottom:1px solid var(--linha)}
.linha.nova{background:transparent}
.linha:hover{box-shadow:none;background:rgba(240,234,222,.7)}
.linha.sel{background:var(--destaque-claro)}
.linha .de{width:210px;font-size:15px;color:var(--texto)}
.linha .txt{font-size:14.5px;color:var(--suave)}
.linha .txt b{font-family:var(--serif2);font-size:16px;color:var(--texto)}
.linha.nova .de{font-weight:600}
.linha.nova .txt b{font-weight:700}
.linha.nova:before{content:"";position:absolute;left:2px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--vinho)}
.linha .data{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.linha.nova .data{color:var(--vinho);font-weight:600}
.linha .est{color:rgba(168,132,60,.55)}
.linha .est.on{color:var(--ouro)}
.linha .rap{background:var(--branco)}
.vazio{font-family:var(--serif2);font-style:italic;color:var(--suave);font-size:17px}
.leitura{padding:34px 48px 60px 96px}
.leitura h1{font-family:var(--serif);font-size:38px;line-height:1.15;letter-spacing:-.005em;margin-bottom:26px;text-wrap:balance}
.etq{border-radius:0;background:transparent;border:1px solid var(--linha);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--vinho);padding:4px 10px}
.av{border-radius:50%;border:1px solid var(--ouro);background:var(--campo)!important;color:var(--ouro2);font-family:var(--serif);font-size:18px}
.msgcab b{font-size:16px;font-weight:600}
.msgcab .mail,.msgcab .para,.msgcab .dir{font-size:13px}
.texto{font-size:16px;line-height:1.7;color:#2A251E;max-width:720px}
.anexo{border-radius:0;border-color:var(--linha);background:var(--campo)}
.anexo .cap{background:transparent;color:var(--ouro2);font-family:var(--serif);font-size:20px;text-transform:uppercase;letter-spacing:.1em}
.anexo .nm i{background:var(--tinta);border-radius:0;letter-spacing:.12em}
.pilula{border-radius:0;border:1px solid var(--tinta);color:var(--tinta);height:44px;padding:0 24px 0 18px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.pilula:hover{background:var(--tinta);color:#F0EADE}
.caixaResp{border-radius:0;border:1px solid var(--ouro);box-shadow:inset 0 0 0 5px var(--branco),inset 0 0 0 6px rgba(168,132,60,.4);padding:22px 26px;background:var(--branco)}
.caixaResp textarea{background:var(--campo);border:1px solid rgba(118,89,31,.35);padding:12px 14px}
.enviar{border-radius:0;background:var(--tinta);color:#F0EADE;height:46px;padding:0 34px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.aviso{border-radius:0;background:var(--tinta);color:#F0EADE;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
/* janela de escrever = o cartão "State the matter." da página de consulta */
.janela{right:50%;bottom:auto;top:50%;transform:translate(50%,-50%);width:min(860px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;border-radius:0;background:var(--branco);border:1px solid var(--ouro);box-shadow:inset 0 0 0 7px var(--branco),inset 0 0 0 8px rgba(168,132,60,.45),0 40px 80px -30px rgba(22,19,15,.45)}
.janela.min{width:320px;top:auto;bottom:0;transform:translateX(50%)}
.jcab{height:auto;background:transparent;border-radius:0;padding:40px 48px 6px;font-family:var(--serif);font-size:32px;font-weight:400;cursor:default}
.jcab span:first-letter{text-transform:uppercase}
.jcorpo{padding:14px 48px 10px;gap:22px}
.jcorpo .dois{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.campo{display:flex;flex-direction:column;gap:10px;min-width:0}
.campo .rotulo{font-size:11.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#3B352C}
.campo .rotulo i{font-style:normal;color:var(--vinho)}
.jcorpo .campo input,.jcorpo .campo textarea{background:var(--campo);border:1px solid rgba(118,89,31,.35);height:48px;padding:0 16px;font-size:16px;font-family:var(--sans);color:var(--texto);border-radius:0}
.jcorpo .campo input:focus,.jcorpo .campo textarea:focus{border-color:var(--ouro)}
.jcorpo .campo textarea{height:240px;padding:14px 16px;line-height:1.6}
.fichas{display:flex;flex-wrap:wrap;gap:10px}
.fichas button{height:40px;padding:0 18px;border:1px solid rgba(118,89,31,.45);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#3B352C;background:transparent}
.fichas button:hover{border-color:var(--tinta)}
.fichas button.on{background:var(--tinta);border-color:var(--tinta);color:#F0EADE}
.jpe{padding:8px 0 34px}
.porta b{font-family:var(--serif);font-weight:400;letter-spacing:.22em}
.porta span{text-transform:uppercase;letter-spacing:.16em;font-size:11.5px}
@media (max-width:820px){
  .barra{height:auto;background:var(--fundo)}
  .corpo{height:auto}
  .painel{margin:0;border-left:0;border-right:0;box-shadow:none}
  .leitura{padding:22px 18px 40px}
  .leitura h1{font-size:28px}
  .jcab{padding:28px 22px 4px;font-size:26px}
  .jcorpo{padding:10px 22px}
  .jcorpo .dois{grid-template-columns:1fr}
  .janela{top:0;transform:translateX(50%);max-height:100dvh;width:100vw;height:100dvh}
  .escrever.flutua{border-radius:0}
}

.logo .nome small{text-transform:none}
/* 23/10/2026 (ela): a caixa não corta, desce até o último e-mail; a página inteira rola */
html,body{height:auto;min-height:100%}
body{overflow:auto}
.barra{position:sticky;top:0;z-index:6;background:var(--fundo)}
.corpo{height:auto;min-height:calc(100dvh - 84px);align-items:flex-start}
.lado{position:sticky;top:84px;max-height:calc(100dvh - 84px)}
.painel{overflow:visible;margin-bottom:64px}
.painel>section{flex:none}
.ferr{position:sticky;top:84px;z-index:3;background:var(--branco)}
.linhas,.leitura{overflow:visible;flex:none}
/* 23/10/2026 (ela): moldura = uma linha fina só, bem clarinha (minimalismo extremo) */
.painel,.janela,.caixaResp{border:1px solid rgba(168,132,60,.22);box-shadow:none}
.janela{box-shadow:0 30px 80px -40px rgba(22,19,15,.25)}
/* 23/10/2026 (ela): sem hambúrguer; o selo M abre a lateral; a marca é ll e.s h; selo de uma linha só */
#sanduiche{display:none}
.barra{padding-left:28px}
.logo .selo{cursor:pointer;box-shadow:none;border:1px solid rgba(168,132,60,.55)}
.logo .nome{letter-spacing:.12em;text-transform:none}
/* 23/10/2026 (ela): pesquisa no fim da página (depois do último e-mail, parada, nada flutuando); fundo creme #FFFBF3 */
:root{--fundo:#FFFBF3}
.corpo{flex-wrap:wrap}
.pesquisa-fim{flex:0 0 100%;display:flex;justify-content:center;padding:8px 24px 96px 280px}
.pesquisa-fim .busca{flex:0 1 720px}
body.fechado .pesquisa-fim{padding-left:72px}
@media (max-width:820px){.pesquisa-fim{padding:24px 16px 80px}}
/* 23/10/2026 (ela): a serifada é EB Garamond */
:root{--serif:'EB Garamond',Garamond,Georgia,serif;--serif2:'EB Garamond',Garamond,Georgia,serif}
.linha .txt b{font-size:17px}
.leitura h1{font-size:42px;font-weight:500}

/* no artefato: igual à caixa de verdade (sem abas, marcadores, adiados, mais) */
.abas,#rotulos,.linha .rot,[data-pasta="adiadas"],[data-acao="mais"]{display:none!important}
</style>

<script>// inbox.lle.sh (23/10/2026): a caixa de e-mail igual ao gmail.

(function () {

const PASTAS = [['entrada', 'caixa de entrada'], ['estrela', 'com estrela'], ['adiadas', 'adiados'], ['enviadas', 'enviados'], ['rascunhos', 'rascunhos']];

const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed ut ultrices orci. Sed sed consectetur erat. Class aptent taciti sociosqu ad litora torquent per conubia nostra, per inceptos himenaeos. Nulla facilisi. Proin hendrerit elit vel hendrerit dictum. Donec vitae felis in odio facilisis pulvinar id eget tortor. Suspendisse eget nunc at dui tincidunt luctus eget et lacus. In dapibus purus interdum, porttitor diam nec, accumsan augue. Aliquam semper rhoncus pellentesque. Duis varius consequat lacus et maximus. Etiam sit amet tempor nibh, eu volutpat mi. Nullam sit amet tellus et orci pellentesque sodales. Curabitur fringilla arcu sapien, a condimentum justo pharetra ut. Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae. Duis vitae arcu sem. Aenean facilisis pulvinar ante maximus venenatis. Etiam ornare nunc eu elit luctus, vel ultrices lectus dictum. Pellentesque et consectetur lorem, ac imperdiet neque. Sed a rutrum lacus. Etiam laoreet erat faucibus purus accumsan venenatis. Nullam lectus odio, vestibulum imperdiet ullamcorper nec, cursus vel nunc. Ut condimentum facilisis tortor, non vestibulum dolor rutrum id. Maecenas mauris arcu, tempus non arcu vel, mattis tristique elit. Donec sed turpis ex. Fusce scelerisque, nibh tempor dapibus sodales, lorem elit vehicula massa, ut feugiat justo dui nec libero. Nullam varius augue ac enim egestas, in volutpat quam molestie. Mauris sagittis aliquet eros, ac auctor justo eleifend quis. Nunc laoreet placerat dui et tristique. Donec vitae turpis ac lacus ullamcorper consequat. Vivamus vulputate eget lorem quis ultricies.'.split('. ');
const GENTE = ['luigi', 'giovanna', 'giulia', 'kamilla', 'sanny', 'marina', 'paula', 'rafa', 'bia', 'teresa', 'joão', 'helena', 'escola', 'livraria', 'banco', 'clínica'];

// os e-mails de exemplo (o banco começou com estes mesmos 120)
function exemplo() {
  const frases = (i, n) => { const s = []; for (let k = 0; k < n; k++) s.push(LOREM[(i + k) % LOREM.length]); return s.join('. ') + '.'; };
  const agora = Date.now(), D = [];

      assunto: LOREM[(i * 3) % LOREM.length].split(' ').slice(0, 6).join(' ').replace(/[,;]/g, '').toLowerCase(),
      corpo: [frases(i, 3), frases(i + 3, 4), frases(i + 7, 2)], t: agora - i * (i < 10 ? 41 : 210) * 60000,
      pasta: i % 17 === 9 ? 'spam' : i % 13 === 6 ? 'enviadas' : i % 19 === 4 ? 'rascunhos' : i % 11 === 10 ? 'arquivo' : 'entrada',
      aba: i % 5 === 3 ? 'social' : i % 7 === 2 ? 'promocoes' : i % 9 === 5 ? 'atualizacoes' : 'principal',
      nova: i < 8 || i % 9 === 0, estrela: i % 6 === 1, importante: i % 4 === 2, adiada: i % 23 === 8,
      rotulo: i % 4 === 0 ? ROTULOS[(i / 4) % 4 | 0][0] : null,
      anexos: i % 5 === 1 ? [['pdf', 'capa ' + (i + 1) + '.pdf'], ['jpg', 'foto.jpg']] : i % 7 === 0 ? [['pdf', 'texto.pdf']] : [], respostas: [] });
  }
  return D;
}

const REAL = location.hostname === 'mail.lle.sh';
const DONA = !!window.__dona;
let D = REAL ? [] : DONA && Array.isArray(window.__msgs) && window.__msgs.length ? window.__msgs : exemplo();
const semeia = !REAL && DONA && !(Array.isArray(window.__msgs) && window.__msgs.length); // banco vazio: começa com os de exemplo
let pasta = 'entrada', aba = 'principal', rotulo = null, termo = '', pagina = 0, aberto = null, sel = new Set(), respondendo = null, pediuChave = false;
const $ = s => document.querySelector(s);
const svg = p => '<svg viewBox="0 0 24 24">' + p + '</svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cor = n => CORES[[...String(n)].reduce((s, c) => s + c.charCodeAt(0), 0) % CORES.length];
const celular = () => matchMedia('(max-width:820px)').matches;
function data(t) {
  const d = new Date(t), h = new Date();
  if (d.toDateString() === h.toDateString()) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');
}
const dataLonga = t => new Date(t).toLocaleString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace(/\./g, '');

// gravar no banco (só a dona). Visitante: pede a chave de acesso uma vez.
let fila = new Map(), timer = null;
function grava(...ms) {
  if (REAL) return;
  if (!DONA) { if (!pediuChave && window.lleChave) { pediuChave = true; window.lleChave.entra(); } return; }
  ms.forEach(m => fila.set(m.id, m));
  clearTimeout(timer); timer = setTimeout(envia, 250);
}
async function envia() {
  const msgs = [...fila.values()]; fila = new Map();
  if (!msgs.length) return;
  try {
    const r = await fetch('/api/msgs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ msgs }) });
    if (!r.ok) throw new Error(r.status);
  } catch (e) { msgs.forEach(m => fila.set(m.id, m)); aviso('não gravou, tentando de novo'); clearTimeout(timer); timer = setTimeout(envia, 4000); }
}
window.addEventListener('beforeunload', () => { if (fila.size) navigator.sendBeacon('/api/msgs', new Blob([JSON.stringify({ msgs: [...fila.values()] })], { type: 'application/json' })); });

function filtra() {
  return D.filter(m => {
    if (rotulo) { if (m.rotulo !== rotulo || m.pasta === 'lixeira' || m.pasta === 'spam') return false; }
    else if (pasta === 'estrela') { if (!m.estrela || m.pasta === 'lixeira') return false; }
    else if (pasta === 'adiadas') { if (!m.adiada || m.pasta === 'lixeira') return false; }
    else if (pasta === 'importantes') { if (!m.importante || m.pasta === 'lixeira' || m.pasta === 'spam') return false; }
    else if (pasta === 'todos') { if (m.pasta === 'lixeira' || m.pasta === 'spam') return false; }
    else { if (m.pasta !== pasta) return false; if (!REAL && pasta === 'entrada' && !termo && (m.aba !== aba || m.adiada)) return false; }
    if (termo && !(m.de + ' ' + m.email + ' ' + m.assunto + ' ' + m.corpo.join(' ')).toLowerCase().includes(termo)) return false;
    return true;
  }).sort((a, b) => b.t - a.t);
}
function conta(p) {
  if (REAL) return p === 'entrada' ? CT.entrada || 0 : p === 'rascunhos' ? CT.rascunhos || 0 : p === 'spam' ? CT.spam || 0 : 0;
  if (p === 'entrada') return D.filter(m => m.pasta === 'entrada' && m.nova && !m.adiada).length;
  if (p === 'rascunhos' || p === 'spam') return D.filter(m => m.pasta === p).length;
  return 0;
}

function desenhaLado() {
  const lista = REAL ? REAIS : abreMais || MAIS.some(([p]) => p === pasta) ? [...PASTAS, ...MAIS] : PASTAS;
  $('#pastas').innerHTML = lista.map(([p, n]) => { const c = conta(p); return '<button class="pasta ' + (!rotulo && p === pasta ? 'ativo' : '') + '" data-pasta="' + p + '">' + svg(IC[p]) + '<span class="t">' + n + '</span>' + (c ? '<span class="n">' + c + '</span>' : '') + '</button>'; }).join('') + (REAL ? '' : '<button class="pasta" data-acao="mais">' + svg(lista.length > PASTAS.length ? IC.menos : IC.mais) + '<span class="t">' + (lista.length > PASTAS.length ? 'menos' : 'mais') + '</span></button>');
  $('#rotulos').innerHTML = REAL ? '' : ROTULOS.map(([r, c]) => '<button class="pasta ' + (rotulo === r ? 'ativo' : '') + '" data-rotulo="' + r + '"><span class="pt" style="background:' + c + '"></span><span class="t">' + r + '</span></button>').join('');
}
function desenhaLista() {
  const v = filtra(), total = v.length, ult = Math.max(0, Math.ceil(total / POR_PAGINA) - 1);
  if (pagina > ult) pagina = ult;
  const pag = v.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);
  const mostraAbas = !REAL && !rotulo && pasta === 'entrada' && !termo;
  $('#abas').hidden = !mostraAbas;
  if (mostraAbas) $('#abas').innerHTML = ABAS.map(([a, n, c1, c2]) => { const c = D.filter(m => m.pasta === 'entrada' && m.aba === a && m.nova && !m.adiada).length; return '<button class="aba ' + (a === aba ? 'ativo' : '') + '" data-aba="' + a + '" style="--cor:' + c1 + ';--cor-t:' + c2 + '">' + svg(IC[a]) + '<span>' + n + '</span>' + (c && a !== aba ? '<span class="novos">' + c + (c > 1 ? ' novos' : ' novo') + '</span>' : '') + '</button>'; }).join('');
  const enviada = p => p === 'enviadas' || p === 'rascunhos';
  $('#linhas').innerHTML = pag.length ? pag.map(m => {
    const rot = m.rotulo && pasta !== 'entrada' || (m.rotulo && rotulo !== m.rotulo) ? '<span class="rot" style="background:' + ROTULOS.find(r => r[0] === m.rotulo)[1] + '40">' + m.rotulo + '</span>' : '';
    const quem = REAL && enviada(m.pasta) ? 'para: ' + esc(m.para || m.de) : enviada(m.pasta) ? 'para: ' + esc(m.de) : m.pasta === 'rascunhos' ? 'rascunho' : esc(m.de);
    return '<div class="linha ' + (m.nova ? 'nova ' : '') + (sel.has(m.id) ? 'sel' : '') + '" data-id="' + m.id + '">'
      + '<span class="marca ' + (sel.has(m.id) ? 'on' : '') + '" data-marca="' + m.id + '"></span>'
      + '<span class="av" style="background:' + cor(m.de) + '">' + esc(m.de[0] || '?') + '</span>'
      + '<button class="est ' + (m.estrela ? 'on' : '') + '" data-est="' + m.id + '">' + svg(IC.estrela) + '</button>'
      + '<button class="imp ' + (m.importante ? 'on' : '') + '" data-imp="' + m.id + '">' + svg(IC.importantes) + '</button>'
      + '<span class="de">' + quem + (m.respostas.length ? '<small>' + (m.respostas.length + 1) + '</small>' : '') + '</span>'
      + '<span class="txt">' + rot + '<b>' + esc(m.assunto) + '</b> — ' + esc(m.corpo[0]) + (m.anexos.length ? '<span class="clip">' + svg(IC.clip) + '</span>' : '') + '</span>'
      + '<span class="data">' + data(m.respostas.length ? m.respostas[m.respostas.length - 1].t : m.t) + '</span>'
      + '<span class="rap"><button class="redondo" data-rap="arquivo">' + svg(IC.arquivo) + '</button><button class="redondo" data-rap="lixeira">' + svg(IC.lixeira) + '</button><button class="redondo" data-rap="lida">' + svg(m.nova ? IC.lida : IC.naolida) + '</button><button class="redondo" data-rap="adiar">' + svg(IC.adiadas) + '</button></span>'
      + '</div>';
  }).join('') : '<div class="vazio">' + (REAL && CARREGANDO[pasta] ? 'carregando…' : termo ? 'nenhum e-mail encontrado' : 'nada em ' + (rotulo || NOME[pasta])) + '</div>';
  $('#pagTxt').textContent = sel.size ? sel.size + ' selecionados' : total ? (pagina * POR_PAGINA + 1) + '–' + (pagina * POR_PAGINA + pag.length) + ' de ' + total : '';
  $('#ferrSel').hidden = !sel.size;
  $('#marcaTodas').classList.toggle('on', pag.length > 0 && pag.every(m => sel.has(m.id)));
}
function desenhaAberto() {
  const m = aberto;
  if (!m) return;
  const v = filtra(), i = v.findIndex(x => x.id === m.id);
  $('#posTxt').textContent = i >= 0 ? (i + 1) + ' de ' + v.length : '';
  const etiquetas = '<span class="etq">' + (NOME[m.pasta] || m.pasta) + '</span>' + (m.rotulo ? '<span class="etq" style="background:' + ROTULOS.find(r => r[0] === m.rotulo)[1] + '40">' + m.rotulo + ' <button data-tirarot="1">' + svg(IC.x) + '</button></span>' : '');
  const de = m.pasta === 'enviadas' || m.pasta === 'rascunhos';
  const cab = (nome, email, para, t, primeiro) => '<div class="msgcab"><span class="av" style="background:' + cor(nome) + '">' + esc(nome[0] || '?') + '</span>'
    + '<div><b>' + esc(nome) + '</b> <span class="mail">&lt;' + esc(email) + '&gt;</span><div class="para">' + para + '</div></div>'
    + '<div class="dir"><span>' + dataLonga(t) + '</span>' + (primeiro ? '<button class="redondo estAberta ' + (m.estrela ? 'on' : '') + '" data-acao="estrela">' + svg(IC.estrela) + '</button><button class="redondo" data-acao="responder">' + svg(IC.responder) + '</button>' : '') + '</div></div>';
  let h = '<h1>' + esc(m.assunto) + etiquetas + '</h1>';
  h += REAL ? (de ? cab('você', m.email, 'para ' + esc(m.para), m.t, true) : cab(m.de, m.email, 'para ' + esc(m.paraEu || 'mim'), m.t, true)) : de ? cab('você', 'le@lle.sh', 'para ' + esc(m.de), m.t, true) : cab(m.de, m.email, 'para mim', m.t, true);
  if (REAL) h += m.html ? '<div class="texto"><iframe class="carta" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="e-mail"></iframe></div>' : '<div class="texto">' + (m.inteiro ? String(m.texto || '').split(/\n{2,}/).map(p => '<p>' + linka(p) + '</p>').join('') : '<p>carregando…</p>') + '</div>';
  else h += '<div class="texto">' + m.corpo.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>';
  if (REAL && m.inteiro && m.anexosR.length) h += '<div class="anexos">' + m.anexosR.map(a => '<a class="anexo" target="_blank" rel="noopener" href="/api/caixa/anexo?pasta=' + m.pr + '&uid=' + m.uid + '&i=' + a.i + '&baixar=1"><div class="cap">' + esc(ext(a.nome)) + '</div><div class="nm"><i>' + esc(ext(a.nome)) + '</i>' + esc(a.nome) + '</div></a>').join('') + '</div>';
  if (!REAL && m.anexos.length) h += '<div class="anexos">' + m.anexos.map(([t, n]) => '<div class="anexo"><div class="cap">' + t + '</div><div class="nm"><i>' + t + '</i>' + esc(n) + '</div></div>').join('') + '</div>';
  if (m.respostas.length) h += '<div class="fio">' + m.respostas.map(r => '<div class="resp">' + cab('você', 'le@lle.sh', 'para ' + esc(m.de), r.t, false) + '<div class="texto">' + r.texto.split(/\n+/).map(p => '<p>' + esc(p) + '</p>').join('') + '</div></div>').join('') + '</div>';
  if (respondendo === m.id) h += '<div class="caixaResp"><div class="para">' + svg(IC.responder) + ' ' + esc(m.de) + ' &lt;' + esc(m.email) + '&gt;</div><textarea id="resp"></textarea><div class="jpe"><button class="enviar" id="enviarResp">enviar</button><button class="redondo" data-acao="descartaResp">' + svg(IC.lixeira) + '</button></div></div>';
  else h += '<div class="botoes"><button class="pilula" data-acao="responder">' + svg(IC.responder) + 'responder</button><button class="pilula" data-acao="encaminhar">' + svg(IC.encaminhar) + 'encaminhar</button></div>';
  $('#leitura').innerHTML = h;
  if (REAL && m.html) poeHtml($('#leitura iframe.carta'), m.html);
  if (respondendo === m.id) $('#resp').focus();
}
function mostra() {
  desenhaLado();
  const lendo = !!aberto;
  $('#vLista').hidden = lendo; $('#vAberto').hidden = !lendo;
  document.body.classList.toggle('lendo', lendo);
  if (lendo) desenhaAberto(); else desenhaLista();
}
function abre(m) {
  aberto = m; respondendo = null;
  if (m && m.nova) { m.nova = false; grava(m); if (REAL) api('acao', { pasta: m.pr, uids: [m.uid], acao: 'lido' }).then(j => { if (j.contas) { CT = j.contas; desenhaLado(); } }).catch(() => {}); }
  if (REAL && m && !m.inteiro) inteiro(m);
  if (m) { $('#leitura').scrollTop = 0; history.pushState({ id: m.id }, '', '#' + m.id); }
  mostra(); window.scrollTo(0, 0);
}
function fecha() { aberto = null; respondendo = null; if (location.hash) history.pushState(null, '', location.pathname); mostra(); }
function aviso(t) { const a = $('#aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove('on'), 2600); }
function acao(ms, a) {
  if (REAL) acaoReal(ms, a);
  ms.forEach(m => {
    if (a === 'lida') m.nova = false; else if (a === 'naolida') m.nova = true;
    else if (a === 'adiar') m.adiada = !m.adiada; else m.pasta = a;
  });
  grava(...ms);
  const n = ms.length > 1 ? ms.length + ' conversas ' : 'conversa ';
  aviso(a === 'lida' ? 'marcado como lido' : a === 'naolida' ? 'marcado como não lido' : a === 'adiar' ? n + (ms[0].adiada ? 'adiada' : 'de volta na caixa') : n + 'movida para ' + NOME[a]);
}

// escrever
let rascunho = null;
function janela(dados) {
  if (REAL) { $('#eDe').value = dados && dados.remetente || 'le@lle.sh'; rascunhoUid = dados && dados.rascunhoUid || null; }
  rascunho = dados && dados.id ? dados : null;

// ---------- mail.lle.sh: a caixa de verdade ----------
const REAIS = [['entrada', 'caixa de entrada'], ['estrela', 'com estrela'], ['enviadas', 'enviados'], ['rascunhos', 'rascunhos'], ['spam', 'spam'], ['lixeira', 'lixeira']];
const DOAPI = { entrada: 'entrada', enviadas: 'enviados', rascunhos: 'rascunhos', spam: 'spam', lixeira: 'lixeira', estrela: 'entrada' };
const DAAPI = { entrada: 'entrada', enviados: 'enviadas', rascunhos: 'rascunhos', spam: 'spam', lixeira: 'lixeira' };
const MEUS = ['le@lle.sh', 'le@umbig.ooo', 'the@fertility.channel'];
let CT = {}, CARREGANDO = {}, VS = {}, rascunhoUid = null;
const ext = n => (String(n).includes('.') ? String(n).split('.').pop() : 'arq').slice(0, 4).toLowerCase();
const linka = t => esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
const nomeDe = p => p ? p.nome || p.email : '';
async function api(rota, corpo) {
  const r = await fetch('/api/caixa/' + rota, corpo ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo), credentials: 'same-origin' } : { credentials: 'same-origin', cache: 'no-store' });
  if (r.status === 401) { fechada(); throw new Error('fechada'); }
  const j = await r.json().catch(() => ({ error: 'resposta' }));
  if (!r.ok || j.error) throw new Error(j.error || 'erro ' + r.status);
  return j;
}
function fechada() { document.body.classList.add('fechada'); }
function converte(e, pr, v) {
  const minha = DAAPI[pr];
  const de = pr === 'enviados' || pr === 'rascunhos';
  const meu = [...(e.para || []), ...(e.cc || [])].map(p => p.email).find(x => MEUS.includes(x) && x !== 'le@lle.sh');
  return { id: pr + ':' + e.uid, uid: e.uid, pr, v, de: de ? 'você' : nomeDe(e.de) || '(sem remetente)', email: (e.de && e.de.email) || '', para: (e.para || []).map(nomeDe).join(', '),
    paraEu: meu || '', assunto: e.assunto || '(sem assunto)', corpo: [e.previa || ''], previa: e.previa || '', t: Date.parse(e.data) || 0, pasta: minha, aba: 'principal',
    nova: !e.lido, estrela: !!e.estrela, importante: false, adiada: false, rotulo: null, anexos: e.anexo ? [['', '']] : [], respostas: [], msgid: e.msgid };
}
async function carrega(p, forca) {
  const pr = DOAPI[p] || 'entrada';
  if (VS[pr] && !forca) return;
  CARREGANDO[p] = true; if (pasta === p) desenhaLista();
  try {
    const j = await api('lista?pasta=' + pr + '&n=100');
    VS[pr] = true; CT = j.contas || CT;
    D = D.filter(m => m.pr !== pr).concat((j.emails || []).map(e => converte(e, pr, j.v)));
  } catch (e) { if (e.message !== 'fechada') aviso('a caixa não respondeu, toque em atualizar'); }
  CARREGANDO[p] = false; mostra();
}
async function buscaReal(q) {
  if (q.length < 2) return;
  const pr = DOAPI[pasta] || 'entrada';
  try { const j = await api('busca?pasta=' + pr + '&q=' + encodeURIComponent(q)); const novos = (j.emails || []).map(e => converte(e, pr, j.v)).filter(n => !D.some(m => m.id === n.id)); D = D.concat(novos); mostra(); } catch (e) {}
}
async function inteiro(m) {
  try {
    const j = await api('msgs?i=' + m.pr + ':' + m.uid + ':' + (m.v || ''));
    const d = j.msgs && j.msgs[m.pr + ':' + m.uid]; if (!d) throw new Error('vazio');
    Object.assign(m, { inteiro: true, html: d.html || '', texto: d.texto || '', anexosR: d.anexos || [], msgidR: d.msgid, refs: d.refs, responderPara: d.responderPara, ccR: d.cc || [], paraR: d.para || [] });
  } catch (e) { m.inteiro = true; m.texto = 'essa mensagem não abriu.'; m.anexosR = []; }
  if (aberto === m) desenhaAberto();
}
function poeHtml(f, html) {
  if (!f) return;
  const csp = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src * data: blob:; style-src \'unsafe-inline\' *; font-src * data:; media-src * data:">';
  f.srcdoc = '<!doctype html><meta charset="utf-8">' + csp + '<base target="_blank"><style>html,body{margin:0;padding:0;color:#202124;font-family:Montserrat,Arial,sans-serif;font-size:15px;line-height:1.55;word-break:break-word;overflow:hidden}img{max-width:100%;height:auto}table{max-width:100%}pre{white-space:pre-wrap}</style>' + html;
  let z = 0;
  const ajusta = () => { try { const doc = f.contentDocument; if (!doc || !doc.body) return;
    if (!z) { const w = f.clientWidth, sw = doc.documentElement.scrollWidth; z = sw > w + 4 ? Math.max(.4, w / sw) : 1; if (z < 1) doc.body.style.zoom = String(z); }
    f.style.height = Math.ceil(doc.documentElement.scrollHeight * (z < 1 ? z : 1)) + 8 + 'px'; } catch (e) {} };
  f.onload = () => { ajusta(); setTimeout(ajusta, 400); setTimeout(ajusta, 1500); };
}
async function acaoReal(ms, a) {
  const grupos = {};
  ms.forEach(m => (grupos[m.pr] = grupos[m.pr] || []).push(m.uid));
  const corpo = a === 'lida' ? { acao: 'lido' } : a === 'naolida' ? { acao: 'naolido' } : DOAPI[a] ? { acao: 'mover', para: DOAPI[a] } : null;
  if (!corpo) return;
  for (const pr of Object.keys(grupos)) {
    try { const j = await api('acao', { pasta: pr, uids: grupos[pr], ...corpo }); if (j.contas) CT = j.contas; } catch (e) { aviso('não deu certo, tente de novo'); }
  }
  if (corpo.acao === 'mover') { VS[corpo.para] = false; ms.forEach(m => { m.pr = corpo.para; m.id = corpo.para + ':' + m.uid + ':movida'; }); }
  desenhaLado();
}
async function enviaReal() {
  const para = $('#ePara').value.trim();
  if (!para.includes('@')) { aviso('falta o destinatário'); $('#ePara').focus(); return; }
  const b = $('#eEnviar'); b.disabled = true; b.textContent = 'enviando…';
  try {
    const j = await api('envia', { de: $('#eDe').value, para, assunto: $('#eAssunto').value.trim(), texto: $('#eTexto').value, irt: JANELA_IRT.irt, refs: JANELA_IRT.refs, rascunho: rascunhoUid });
    if (j.contas) CT = j.contas;
    $('#janela').hidden = true; rascunhoUid = null; JANELA_IRT = {}; VS.enviados = false; VS.rascunhos = false; aviso('mensagem enviada'); mostra();
  } catch (e) { aviso('não foi enviada: ' + e.message); }
  b.disabled = false; b.textContent = 'enviar';
}
let JANELA_IRT = {};
async function respondeReal(v) {
  const m = aberto; if (!m) return;
  const quem = (m.responderPara && m.responderPara.length ? m.responderPara : [{ email: m.email }]).map(p => p.email).join(', ');
  const de = MEUS.find(x => x !== 'le@lle.sh' && [...(m.paraR || []), ...(m.ccR || [])].some(p => p.email === x)) || 'le@lle.sh';
  const b = $('#enviarResp'); b.disabled = true; b.textContent = 'enviando…';
  try {
    await api('envia', { de, para: quem, assunto: /^re:/i.test(m.assunto) ? m.assunto : 'Re: ' + m.assunto, texto: v + '\n\n' + 'Em ' + dataLonga(m.t) + ', ' + m.de + ' <' + m.email + '> escreveu:\n' + String(m.texto || '').split('\n').map(l => '> ' + l).join('\n'), irt: m.msgidR, refs: m.refs });
    m.respostas.push({ texto: v, t: Date.now() }); respondendo = null; VS.enviados = false; aviso('mensagem enviada'); desenhaAberto();
  } catch (e) { b.disabled = false; b.textContent = 'enviar'; aviso('não foi enviada: ' + e.message); }
}

document.addEventListener('click', e => {
  const t = e.target;
  const marca = t.closest('[data-marca]'), est = t.closest('[data-est]'), imp = t.closest('[data-imp]'), rap = t.closest('[data-rap]'), linha = t.closest('.linha');
  if (marca) { const id = marca.dataset.marca; sel.has(id) ? sel.delete(id) : sel.add(id); desenhaLista(); return; }
  if (est) { const m = D.find(x => x.id === est.dataset.est); m.estrela = !m.estrela; grava(m); if (REAL) api('acao', { pasta: m.pr, uids: [m.uid], acao: m.estrela ? 'estrela' : 'semestrela' }).catch(() => aviso('não deu certo')); desenhaLista(); return; }
  if (imp) { const m = D.find(x => x.id === imp.dataset.imp); m.importante = !m.importante; grava(m); desenhaLista(); return; }
  if (rap) { const m = D.find(x => x.id === linha.dataset.id); const a = rap.dataset.rap; acao([m], a === 'lida' ? (m.nova ? 'lida' : 'naolida') : a); mostra(); return; }
  if (linha) { const m = D.find(x => x.id === linha.dataset.id); if (m.pasta === 'rascunhos') janela(REAL ? { titulo: 'rascunho', de: m.para, assunto: m.assunto, corpo: [m.previa], rascunhoUid: m.uid } : m); else abre(m); return; }
  if (t.closest('.lado') && celular() && t.closest('button')) document.body.classList.remove('menu');
  const b = t.closest('button');
  if (!b) { if (celular() && document.body.classList.contains('menu') && !t.closest('.lado')) document.body.classList.remove('menu'); return; }
  if (b.id === 'sanduiche') { document.body.classList.toggle(celular() ? 'menu' : 'fechado'); return; }
  if (b.dataset.pasta) { pasta = b.dataset.pasta; rotulo = null; pagina = 0; sel.clear(); aberto = null; if (REAL) carrega(pasta); mostra(); return; }
  if (b.dataset.rotulo) { rotulo = b.dataset.rotulo; pagina = 0; sel.clear(); aberto = null; mostra(); return; }
  if (b.dataset.aba) { aba = b.dataset.aba; pagina = 0; sel.clear(); desenhaLista(); return; }
  if (b.dataset.pag) { const tot = Math.ceil(filtra().length / POR_PAGINA); pagina = Math.min(Math.max(0, pagina + +b.dataset.pag), Math.max(0, tot - 1)); desenhaLista(); $('#linhas').scrollTop = 0; return; }
  if (b.id === 'todas') { const v = filtra().slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA); const todas = v.length && v.every(m => sel.has(m.id)); v.forEach(m => todas ? sel.delete(m.id) : sel.add(m.id)); desenhaLista(); return; }
  if (b.dataset.massa) { acao(D.filter(m => sel.has(m.id)), b.dataset.massa); sel.clear(); mostra(); return; }
  if (b.dataset.anda && aberto) { const v = filtra(), i = v.findIndex(x => x.id === aberto.id), n = v[i + +b.dataset.anda]; if (n) abre(n); return; }
  if (b.id === 'limpaBusca') { $('#busca').value = ''; termo = ''; b.hidden = true; mostra(); return; }
  if (b.id === 'eEnviar') { enviaNova(); return; }
  if (b.id === 'enviarResp') { const v = $('#resp').value.trim(); if (!v) return; if (REAL) { respondeReal(v); return; } aberto.respostas.push({ texto: v, t: Date.now() }); grava(aberto); respondendo = null; aviso('mensagem enviada'); desenhaAberto(); return; }
  if (b.dataset.tirarot && aberto) { aberto.rotulo = null; grava(aberto); desenhaAberto(); return; }
  const a = b.dataset.acao; if (!a) return;
  if (a === 'escrever') { janela(null); return; }

  if (a === 'minimiza') { $('#janela').classList.toggle('min'); return; }
  if (a === 'atualiza') { if (REAL) carrega(pasta, true); else if (DONA) location.reload(); else mostra(); return; }
  if (a === 'voltar') { fecha(); return; }
  if (!aberto) return;
  if (a === 'arquivo' || a === 'lixeira' || a === 'spam') { acao([aberto], a); fecha(); return; }
  if (a === 'naolida') { acao([aberto], 'naolida'); fecha(); return; }
  if (a === 'adiar') { acao([aberto], 'adiar'); fecha(); return; }
  if (a === 'estrela') { aberto.estrela = !aberto.estrela; grava(aberto); if (REAL) api('acao', { pasta: aberto.pr, uids: [aberto.uid], acao: aberto.estrela ? 'estrela' : 'semestrela' }).catch(() => aviso('não deu certo')); desenhaAberto(); return; }
  if (a === 'responder') { respondendo = aberto.id; desenhaAberto(); return; }
  if (a === 'descartaResp') { respondendo = null; desenhaAberto(); return; }
  if (a === 'encaminhar' && REAL) { JANELA_IRT = {}; janela({ titulo: 'encaminhar', assunto: 'enc: ' + aberto.assunto, corpo: ['', '---------- mensagem encaminhada ----------', 'de: ' + aberto.de + ' <' + aberto.email + '>', 'assunto: ' + aberto.assunto, '', aberto.texto || aberto.previa] }); $('#ePara').value = ''; $('#ePara').focus(); return; }
  if (a === 'encaminhar') { janela({ titulo: 'encaminhar', assunto: 'enc: ' + aberto.assunto, corpo: ['', '---------- mensagem encaminhada ----------', 'de: ' + aberto.de + ' <' + aberto.email + '>', ...aberto.corpo] }); $('#ePara').focus(); return; }
});
