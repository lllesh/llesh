<!doctype html>
<html lang="pt-BR" data-lado class="tema-cores">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>leticia.cores</title>
<meta name="description" content="leticia.cards de lado, cada página numa cor">
<link rel="icon" type="image/png" href="https://leticia.land/cores/icon.png">
<link rel="apple-touch-icon" href="https://leticia.land/cores/apple-touch-icon.png">
<meta property="og:title" content="leticia.cores">
<meta property="og:description" content="leticia.cards de lado, cada página numa cor">
<meta property="og:image" content="https://leticia.land/cores/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800;900&display=swap">
<script src="https://lle.sh/lenis/liso.js" defer></script>
<style>
@font-face{font-family:S;src:url(/sites/leticia.land/cores/black.woff2) format("woff2");font-weight:900;font-display:block}
@font-face{font-family:S;src:url(/sites/leticia.land/cores/bold.woff2) format("woff2");font-weight:700;font-display:block}
a, button, input, select, textarea, [tabindex] { outline: none; -webkit-tap-highlight-color: transparent; }
:focus, :focus-visible { outline: none; box-shadow: none; }
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}
body{font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;background:#ff0d0d}
main{display:flex;width:max-content;height:100vh;height:100dvh}
section.pg{flex:none;width:100vw;height:100%;position:relative;background:var(--c);color:var(--t);overflow:clip}
section.pg.carta{content-visibility:auto;contain-intrinsic-size:100vw 100vh}
.tela{position:sticky;left:0;width:100vw;height:100%;overflow:hidden}

/* a disposição de leticia.cards (cartas/index.html e carta/index.html), só de lado */
.home .wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.home .abre{padding-block:12vh 4vh}
.home h1{margin:0;font-weight:900;font-size:clamp(76px,17vw,240px);line-height:.8;letter-spacing:-.06em}
.leitura p{margin:0;font-weight:800;font-size:clamp(30px,5.2vw,72px);line-height:1.05;letter-spacing:-.035em;max-width:17ch}
@media (min-width:1024px){.leitura p{font-size:clamp(24px,3.6vw,50px);max-width:30ch}}
.leitura .t{color:var(--off);transition:color .45s ease}
.leitura .t.on{color:var(--on)}

.carta .wrap{padding-inline:clamp(52px,11vw,180px)}
.carta .abre{padding-top:12vh;padding-bottom:28px}
.carta h1{margin:0 0 0 -.028em;font-weight:900;font-size:clamp(76px,17vw,240px);line-height:.68;letter-spacing:-.06em;overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual;-webkit-hyphenate-character:"";hyphenate-character:""}
.carta .sub{margin-top:34px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
.midia{flex:none;height:100%;display:flex;align-items:center;padding:48px clamp(52px,11vw,180px) 48px 0}
.midia img{display:block;height:100%;max-width:80vw;object-fit:contain}
section.pg.com-midia{width:auto;display:flex}
section.pg.com-midia .tela{flex:none}

/* B L E I B T: fonte, cor e estilo; a disposição continua a mesma */
.tema-bleibt body{background:#fafafa;font-family:S,Arial,sans-serif}
.tema-bleibt section.pg{background:#fafafa;color:#ff0d0d}
.tema-bleibt h1{font-weight:900!important;letter-spacing:-.11em!important}
.tema-bleibt .carta h1{line-height:.74}
.tema-bleibt .leitura p{font-weight:700;letter-spacing:-.07em}
.tema-bleibt .carta .sub{font-weight:700;font-size:19px;letter-spacing:-.07em;text-transform:none}
.tema-bleibt .regua{position:fixed;left:0;right:0;top:7vh;height:1px;background:#1a1a1a;opacity:.7;z-index:4;pointer-events:none}
.tema-bleibt .linha{position:fixed;top:0;bottom:0;left:41.8vw;width:1px;background:#ff0d0d;z-index:4;pointer-events:none}
@media (max-width:700px){.tema-bleibt .linha{left:50vw}.tema-bleibt .carta .sub{font-size:15px}}
.regua,.linha{display:none}
.tema-bleibt .regua,.tema-bleibt .linha{display:block}
@media (prefers-reduced-motion:reduce){.leitura .t{transition:none}}
</style>
</head>
<body>
<div class="regua"></div><div class="linha"></div>
<main id="m"></main>
<script src="/sites/leticia.land/cores/cartas.js"></script>
<script>
(function () {
  var TEMA = 'cores';
  // cores vivas, em arco-íris, uma por página
  var CORES = ['#FF0D0D', '#FF5A00', '#FFB000', '#FFE100', '#8BD100', '#00B84F', '#00A991', '#00A3E8', '#0047FF', '#5B2BFF', '#A100FF', '#FF1493'];
  function claro(hex) { var n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255; function l(v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4) } return .2126 * l(r) + .7152 * l(g) + .0722 * l(b) > .4 }
  function pinta(sec, i) {
    if (TEMA === 'bleibt') { sec.style.cssText += ';--c:#fafafa;--t:#ff0d0d;--sub:#d8d0d0;--off:#d8d0d0;--on:#ff0d0d'; return }
    var c = CORES[i % CORES.length], t = claro(c) ? '#1A1A1A' : '#FFFBF3';
    sec.style.setProperty('--c', c); sec.style.setProperty('--t', t);
    sec.style.setProperty('--sub', t === '#1A1A1A' ? 'rgba(26,26,26,.6)' : 'rgba(255,251,243,.75)');
    sec.style.setProperty('--off', t === '#1A1A1A' ? 'rgba(26,26,26,.2)' : 'rgba(255,251,243,.3)');
    sec.style.setProperty('--on', t);
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
  // igual a carta/index.html: corta cada palavra do título no meio, numa sílaba; o navegador só usa o corte se a palavra não couber
  function quebra(t) {
    var V = /[aeiouáéíóúâêôãõàü]/i, JUNTO = /^(ch|lh|nh|qu|gu|[bcdfgptv][rl])$/i;
    return String(t).split(/(\s+)/).map(function (w) {
      if (w.length < 6 || /\s/.test(w)) return w;
      var cortes = [];
      for (var i = 2; i <= w.length - 2; i++) {
        var a = w[i - 1], b = w[i], c = w[i + 1];
        if (V.test(a) && !V.test(b) && V.test(c)) cortes.push(i);
        else if (!V.test(a) && !V.test(b) && V.test(c) && V.test(w[i - 2] || '')) cortes.push(JUNTO.test(a + b) ? i - 1 : i);
      }
      cortes = cortes.filter(function (i) { return i >= 2 && i <= w.length - 2 });
      if (!cortes.length) return w;
      var meio = w.length / 2, melhor = cortes.sort(function (x, y) { return Math.abs(x - meio) - Math.abs(y - meio) })[0];
      return w.slice(0, melhor) + '­' + w.slice(melhor);
    }).join('');
  }
  var m = document.getElementById('m');

  // página 1: o início (cartas + o texto que acende, frase por frase)
  var home = el('section', 'pg home'); pinta(home, 0);
  var tela = el('div', 'tela'), ab = el('header', 'wrap abre'), h1 = el('h1', '', 'cartas');
  h1.setAttribute('data-fit', ''); ab.appendChild(h1); tela.appendChild(ab);
  var lw = el('div', 'wrap leitura'), p = el('p'); p.setAttribute('data-fit', ''); lw.appendChild(p); tela.appendChild(lw);
  home.appendChild(tela); m.appendChild(home);
  var partes = [], a = '', n = 0;
  window.INTRO.split(/(\s+)/).forEach(function (w) { if (/^\s+$/.test(w)) { a += w; return } a += w; n++; if (/[,.:;]$/.test(w) || n >= 6) { partes.push(a); a = ''; n = 0 } }); if (a) partes.push(a);
  var ts = partes.map(function (x) { var s = el('span', 't', x); p.appendChild(s); return s });

  // uma página para cada carta, na ordem de "todas as cartas"
  var secs = [];
  window.CARTAS.forEach(function (c, i) {
    var s = el('section', 'pg carta'); pinta(s, i + 1);
    var tl = el('div', 'tela'), hd = el('header', 'wrap abre'), t = el('h1', '', quebra(c[1] || 'carta'));
    t.setAttribute('data-fit', ''); hd.appendChild(t); hd.appendChild(el('div', 'sub', 'leticia.cards · ' + c[0]));
    tl.appendChild(hd); s.appendChild(tl);
    if (c[2]) { s.classList.add('com-midia'); var md = el('div', 'midia'), im = el('img'); im.src = c[2]; im.alt = ''; im.loading = 'lazy'; md.appendChild(im); s.appendChild(md) }
    m.appendChild(s); secs.push(s);
  });

  // o texto acende conforme a página anda de lado (no original, conforme rolava para baixo)
  var esp = 0;
  function largura() { esp = Math.round(ts.length * innerWidth * 0.2); home.style.width = (innerWidth + esp) + 'px' }
  function roda() {
    var x = -home.getBoundingClientRect().left, prog = Math.max(0, x) / Math.max(1, esp), at = Math.min(ts.length - 1, Math.floor(prog * ts.length));
    if (x < 1) at = -1; // como no original: no começo nenhuma frase acesa
    ts.forEach(function (s, i) { s.classList.toggle('on', i === at) });
  }
  // cabe na tela: o tamanho é o do original; só diminui quando não cabe na altura (de lado a página não cresce para baixo)
  function cabe(sec) {
    var tl = sec.querySelector('.tela'), fs = [].slice.call(sec.querySelectorAll('[data-fit]')), k = innerWidth + 'x' + innerHeight;
    if (sec._k === k) return; sec._k = k;
    fs.forEach(function (e) { e.style.fontSize = '' });
    fs.forEach(linhasDoOriginal); // as linhas quebram onde quebram no original, mesmo quando a letra diminui para caber
    var base = fs.map(function (e) { return parseFloat(getComputedStyle(e).fontSize) });
    var limite = tl.clientHeight - Math.max(24, innerHeight * 0.06);
    function ok() {
      var top = tl.getBoundingClientRect().top, ult = tl.querySelector('.leitura p') || tl.querySelector('.sub') || fs[fs.length - 1];
      if (ult.getBoundingClientRect().bottom - top > limite) return false;
      return fs.every(function (e) { return e.scrollWidth <= e.clientWidth + 2 });
    }
    function poe(f) { fs.forEach(function (e, i) { e.style.fontSize = (base[i] * f) + 'px' }) }
    if (ok()) return;
    var lo = 0.08, hi = 1;
    for (var j = 0; j < 12; j++) { var mid = (lo + hi) / 2; poe(mid); if (ok()) lo = mid; else hi = mid }
    poe(lo);
  }
  // as linhas quebram exatamente onde quebram no leticia.cards (medidas numa cópia invisível em Figtree, com o tamanho do original)
  function marca(e) {
    if (e._tk) return;
    var nos = [], w = document.createTreeWalker(e, NodeFilter.SHOW_TEXT); while (w.nextNode()) nos.push(w.currentNode);
    nos.forEach(function (n) {
      var pd = n.textContent.match(/[^\s­]*­|[^\s­]+|\s+/g) || [], fr = document.createDocumentFragment();
      pd.forEach(function (x) { if (/^\s+$/.test(x)) fr.appendChild(document.createTextNode(x)); else { var s = document.createElement('span'); s.className = 'tk'; s.textContent = x; fr.appendChild(s) } });
      n.parentNode.replaceChild(fr, n);
    });
    e._tk = [].slice.call(e.querySelectorAll('.tk'));
  }
  function linhasDoOriginal(e) {
    marca(e);
    [].slice.call(e.querySelectorAll('br.qb')).forEach(function (b) { b.remove() });
    e.style.whiteSpace = '';
    var g = e.cloneNode(true), pai = e.parentNode, cs = getComputedStyle(pai), h = e.tagName === 'H1';
    var largura = pai.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var st = { position: 'absolute', visibility: 'hidden', left: '0', top: '0', 'white-space': 'normal', 'font-family': '"Figtree",system-ui,sans-serif',
      'font-weight': h ? '900' : '800', 'letter-spacing': h ? '-.06em' : '-.035em', width: largura + 'px', 'max-width': h ? 'none' : (innerWidth >= 1024 ? '30ch' : '17ch'), 'font-size': getComputedStyle(e).fontSize };
    for (var k in st) g.style.setProperty(k, st[k], 'important');
    pai.appendChild(g);
    var tg = [].slice.call(g.querySelectorAll('.tk')), quebra = [], y = null;
    tg.forEach(function (t, i) { var top = t.getBoundingClientRect().top; if (y !== null && top > y + 2) quebra.push(i); y = top });
    g.remove();
    quebra.forEach(function (i) { var t = e._tk[i], b = document.createElement('br'); b.className = 'qb'; t.parentNode.insertBefore(b, t) });
    e.style.whiteSpace = 'nowrap';
  }
  var perto = new Set();
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { perto.add(e.target); cabe(e.target) } else perto.delete(e.target) }) }, { rootMargin: '0px 300% 0px 300%' });
  function ajusta() { largura(); cabe(home); perto.forEach(cabe); roda() }
  secs.forEach(function (s) { io.observe(s) });
  addEventListener('scroll', roda, { passive: true });
  addEventListener('resize', ajusta);
  if (document.fonts && document.fonts.ready) Promise.all([document.fonts.ready, document.fonts.load('900 100px Figtree'), document.fonts.load('800 100px Figtree'), TEMA === 'bleibt' && document.fonts.load('900 100px S'), TEMA === 'bleibt' && document.fonts.load('700 100px S')]).catch(function () {}).then(function () { home._k = ''; perto.forEach(function (s) { s._k = '' }); ajusta() });
  ajusta();
})();
</script>
</body>
</html>
