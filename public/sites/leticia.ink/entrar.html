<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>entrando…</title>
<link rel="icon" type="image/png" sizes="48x48" href="/sites/leticia.ink/favicon.png">
<style>html,body{margin:0;height:100%;background:#FFFBF3}a,button,input,select,textarea,[tabindex]{outline:none;-webkit-tap-highlight-color:transparent}:focus,:focus-visible{outline:none;box-shadow:none}</style>
</head>
<body>
<script>
/* leticia.ink/entrar (17/10/2026): o leticia.ink é FECHADO e entra pela porta nova do i.lle.sh (i.lle.sh/sso), nunca por tela de entrar própria.
   Sem a chave: vai ao i.lle.sh e volta aqui com #sso=…; o servidor (api/porta) confere a conta (só a dona) e dá a chave (cookie leticia-chave). Tela velha guardada em _ferramentas/entrar.guardado. */
(function () {
  var q = new URLSearchParams(location.search), volta = q.get('volta') || '/';
  if (volta.charAt(0) !== '/' || volta.indexOf('//') === 0) volta = '/';
  var sso = (location.hash.match(/[#&]sso=([^&]+)/) || [])[1];
  function vaiPorta() { location.replace('https://i.lle.sh/sso?volta=' + encodeURIComponent(location.origin + '/entrar?volta=' + encodeURIComponent(volta))) }
  if (!sso) return vaiPorta();
  history.replaceState(null, '', location.pathname + location.search);
  fetch('/api/porta', { method: 'POST', headers: { Authorization: 'Bearer ' + decodeURIComponent(sso) } })
    .then(function (r) { return r.json() })
    .then(function (j) {
      if (!j || !j.ok || !j.chave) { document.body.innerHTML = '<p style="font:19px/1.4 system-ui,sans-serif;text-align:center;padding:120px 24px;color:#2B2729">essa parte é só da Letícia</p>'; return }
      try { localStorage.setItem('leticia-chave', j.chave) } catch (e) {}
      document.cookie = 'leticia-chave=' + encodeURIComponent(j.chave) + '; Path=/; Max-Age=' + (30 * 86400) + '; Secure; SameSite=Lax';
      location.replace(j.papel === 'moradia' ? '/eu/moradia/' : volta);
    })
    .catch(function () { document.body.innerHTML = '<p style="font:19px/1.4 system-ui,sans-serif;text-align:center;padding:120px 24px;color:#2B2729">sem conexão, tenta de novo</p>' });
})();
</script>
</body>
</html>
