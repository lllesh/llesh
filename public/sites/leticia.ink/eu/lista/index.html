</style><style>.nomes{list-style:none;margin:0;padding:0;display:grid;gap:.12em}.nomes a{display:block;font-size:clamp(44px,7vw,110px);line-height:1;letter-spacing:-.045em;color:var(--red)}</style><style>h1{overflow-wrap:anywhere;font-size:clamp(56px,8vw,140px)!important}</style><style>/* 15/10: cada assunto uma cor forte */.nomes li:nth-child(12n+1) a{color:#ff0d0d}.nomes li:nth-child(12n+2) a{color:#ff6b00}.nomes li:nth-child(12n+3) a{color:#f5b700}.nomes li:nth-child(12n+4) a{color:#00b050}.nomes li:nth-child(12n+5) a{color:#00a6d6}.nomes li:nth-child(12n+6) a{color:#2f54ff}.nomes li:nth-child(12n+7) a{color:#8a2be2}.nomes li:nth-child(12n+8) a{color:#ff1f8f}.nomes li:nth-child(12n+9) a{color:#00c2a8}.nomes li:nth-child(12n+10) a{color:#d10068}.nomes li:nth-child(12n+11) a{color:#6a00f4}.nomes li:nth-child(12n+12) a{color:#ff3d00}</style></head><body>
